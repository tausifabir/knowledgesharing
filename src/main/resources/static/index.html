<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge sharing · Notes</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172b36; background: #f3f5f7; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    form, article { background: white; border: 1px solid #ccd5db; border-radius: 10px; padding: 1.5rem; margin: 1rem 0; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    input, textarea, button { font: inherit; box-sizing: border-box; }
    input, textarea { width: 100%; padding: .7rem; border: 1px solid #637985; border-radius: 5px; margin-bottom: 1rem; }
    textarea { min-height: 150px; resize: vertical; }
    button { background: #164c64; color: white; border: 0; border-radius: 5px; padding: .7rem 1.2rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #a34d00; outline-offset: 3px; }
    article p { white-space: pre-wrap; overflow-wrap: anywhere; }
    article h3 { overflow-wrap: anywhere; }
    time { color: #52616b; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Knowledge sharing</h1>
  <p>Save a note to PostgreSQL.</p>
  <form id="note-form">
    <label for="title">Title</label>
    <input id="title" name="title" maxlength="200" required>
    <label for="content">Content</label>
    <textarea id="content" name="content" maxlength="10000" required></textarea>
    <button id="save" type="submit">Save note</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <h2>Latest 100 notes</h2>
  <button type="button" id="refresh">Refresh notes</button>
  <section id="notes" aria-label="Saved notes"></section>
  <script>
    const form = document.querySelector('#note-form');
    const status = document.querySelector('#status');
    const save = document.querySelector('#save');
    const notes = document.querySelector('#notes');

    async function loadNotes() {
      const response = await fetch('/api/notes');
      if (!response.ok) throw new Error('Could not load notes. Check database connection.');
      const data = await response.json();
      notes.replaceChildren();
      if (!data.length) notes.textContent = 'No notes saved yet.';
      for (const note of data) {
        const article = document.createElement('article');
        const title = document.createElement('h3');
        const content = document.createElement('p');
        const time = document.createElement('time');
        title.textContent = note.title;
        content.textContent = note.content;
        time.dateTime = note.createdAt;
        time.textContent = new Date(note.createdAt).toLocaleString();
        article.append(title, content, time);
        notes.append(article);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const title = form.elements.title.value.trim();
      const content = form.elements.content.value.trim();
      if (!title || !content) {
        status.textContent = 'Title and content cannot be blank.';
        return;
      }
      save.disabled = true;
      status.textContent = 'Saving…';
      try {
        const response = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        if (!response.ok) throw new Error(response.status === 400
          ? 'Invalid note. Check field lengths and content.'
          : 'Save not confirmed. Refresh notes before retrying.');
        form.reset();
        status.textContent = 'Note saved.';
        try { await loadNotes(); }
        catch { status.textContent = 'Note saved, but list refresh failed. Refresh notes to view it.'; }
      } catch (error) {
        status.textContent = error instanceof TypeError
          ? 'Connection lost. Save not confirmed; refresh notes before retrying.' : error.message;
      } finally {
        save.disabled = false;
      }
    });
    document.querySelector('#refresh').addEventListener('click', () => {
      loadNotes().then(() => { status.textContent = 'Notes refreshed.'; })
        .catch(error => { status.textContent = error.message; });
    });
    loadNotes().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
